name: Verify divisor witnesses

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean toolchain manager
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned Mathlib cache
        run: lake exe cache get
      - name: Build proof
        run: |
          set -o pipefail
          lake build DivisorWitnesses 2>&1 | tee build.log
      - name: Audit transitive axioms
        run: |
          set -o pipefail
          lake env lean Audit.lean 2>&1 | tee axiom-audit.log
          python3 scripts/check_axioms.py axiom-audit.log
      - name: Fresh Lean kernel replay
        run: |
          set -o pipefail
          lake env leanchecker --fresh --verbose DivisorWitnesses 2>&1 | tee kernel-replay.log
      - name: Check pinned source provenance
        run: python3 scripts/check_sources.py
      - name: Archive verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ github.sha }}
          path: |
            lake-manifest.json
            lean-toolchain
            upstream-manifest.json
            build.log
            axiom-audit.log
            kernel-replay.log
